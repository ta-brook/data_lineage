# =============================================================================
# spark-defaults.conf — Spark configuration for the Iceberg sink hop.
# Baked into the image by Dockerfile.spark; read by spark-submit on the
# master and workers (deploy-mode cluster, spec 04 §2).
# =============================================================================

# --- Nessie catalog (Iceberg) ------------------------------------------------
# SparkCatalog with type=nessie: client-side S3 config. The Nessie server only
# stores catalog metadata (RocksDB); all object I/O goes to MinIO from Spark
# (spec 05 §2). ${MINIO_ROOT_USER}/${MINIO_ROOT_PASSWORD} are substituted by
# Spark from the container env (set on spark-master/spark-worker in compose).
spark.sql.catalog.nessie=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.type=nessie
spark.sql.catalog.nessie.uri=http://nessie:19120/api/v2
spark.sql.catalog.nessie.ref=main
spark.sql.catalog.nessie.warehouse=s3://poc-warehouse/
spark.sql.catalog.nessie.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.nessie.s3.endpoint=http://minio:9000
spark.sql.catalog.nessie.s3.path-style-access=true
spark.sql.catalog.nessie.s3.access-key-id=${MINIO_ROOT_USER}
spark.sql.catalog.nessie.s3.secret-access-key=${MINIO_ROOT_PASSWORD}

# --- S3A mirror for Hadoop ---------------------------------------------------
# Lets Hadoop/Spark components that speak S3A (not S3FileIO) reach MinIO too.
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER}
spark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD}
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# --- OpenLineage -------------------------------------------------------------
# Emits lineage events from the Spark logical plan (columnLineage, kafkaOffset,
# sparkApplication, parentRun facets — spec 02). Console transport is the POC
# fallback; a Marquez sink can be added by switching transport.type to http
# and adding spark.openlineage.transport.url (STATE.md §6).
spark.extraListeners=io.openlineage.spark.agent.OpenLineageSparkListener
spark.openlineage.transport.type=console

# --- SQL extensions ----------------------------------------------------------
# Iceberg + Nessie session extensions (MERGE INTO, Nessie DDL/refs).
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions

# --- Catalog implementation --------------------------------------------------
# Spark manages the catalog itself via the nessie catalog (no Hive metastore).
spark.sql.catalogImplementation=in-memory