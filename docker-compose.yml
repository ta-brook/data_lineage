# Data Lineage POC — docker-compose topology
# Pipeline: MySQL -> Debezium -> Kafka -> Airflow -> Spark -> Iceberg (Nessie + MinIO)
#
# Project name matches the lineage deployment facet instance_id (specs/02-lineage-model.md).
# All service names are the DNS identities used in the lineage model and the
# deployment facet endpoints. Do not rename services without updating specs 02/07.
#
# Author: poc-orchestrator. Authored only — not executed or tested.

name: data-lineage-poc

networks:
  lineage-poc:
    driver: bridge

volumes:
  mysql-data:
  kafka-data:
  minio-data:
  airflow-db-data:
  nessie-data:
  marquez-db-data:

services:
  # ---------------------------------------------------------------------------
  # Hop 1+2: MySQL source -> Debezium Connect -> Kafka (KRaft) + Schema Registry
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "13306:3306" # host remap avoids local MySQL collisions
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shop
      MYSQL_USER: ${MYSQL_USER:-poc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./provisioning/init-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./provisioning/cdc.cnf:/etc/mysql/conf.d/cdc.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lineage-poc]

  kafka:
    image: confluentinc/cp-kafka:7.9.0 # KRaft: combined broker + controller, no ZooKeeper
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: ${CLUSTER_ID} # fixed UUID; image auto-formats the KRaft log dir
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # Debezium topic.creation controls topics
      KAFKA_LOG_RETENTION_HOURS: 168 # 7d retention (spec 03)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [lineage-poc]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    container_name: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lineage-poc]

  connect:
    image: data-lineage-poc/connect:3.6.2.Final
    build:
      context: .
      dockerfile: Dockerfile.connect
    container_name: connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      marquez:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lineage-poc]

  # ---------------------------------------------------------------------------
  # Hop 3+4+5: Airflow (orchestration) -> Spark (transform) -> Iceberg (Nessie+MinIO)
  # ---------------------------------------------------------------------------
  airflow-db:
    image: postgres:16
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lineage-poc]

  airflow-webserver:
    image: data-lineage-poc/airflow:3.2.2
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    command: airflow api-server
    ports:
      - "8080:8080"
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor # Spark does the compute; no Celery needed
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager # Airflow 3: FAB auth so the entrypoint's _AIRFLOW_WWW_USER_* admin creation runs
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__API__EXPOSE_CONFIG: "true"
      # Airflow 3: the scheduler's LocalExecutor spawns tasks that connect back to
      # the api-server's execution API. Default is localhost:8080 (the container's
      # own loopback) -> point it at the api-server service instead.
      AIRFLOW__API__BASE_URL: http://airflow-webserver:8080
      # Airflow 3: JWT used to authenticate task-runner <-> execution API must be
      # identical across scheduler (signs) and api-server (validates).
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      # Airflow 3: db migrate is explicit (no auto-migrate like 2.x) - run it on
      # the api-server so the webserver starts with a migrated metadata DB.
      _AIRFLOW_DB_MIGRATE: "true"
      # Initial admin user (Airflow 3; D2): the official image entrypoint creates
      # the FAB admin from _AIRFLOW_WWW_USER_* when _AIRFLOW_WWW_USER_CREATE is set.
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
      AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez:5000", "endpoint": "/api/v1/lineage"}' # Marquez sink (spec 04; T-01)
      AIRFLOW__OPENLINEAGE__NAMESPACE: airflow # matches the DAGs' inline pin (spec 02/04)
      # SparkSubmitOperator parent/transport conf injection (EXE-01 runbook step 10):
      # both default to False, so without these the Spark run never gets
      # spark.openlineage.parentJobName/parentRunId and the Airflow->Spark parentRun
      # facet is missing in Marquez. Enable both so the child Spark run links back to
      # the Airflow task run (spec 02/04 parentRun facet).
      AIRFLOW__OPENLINEAGE__SPARK_INJECT_PARENT_JOB_INFO: "true"
      AIRFLOW__OPENLINEAGE__SPARK_INJECT_TRANSPORT_INFO: "true"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pocadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD} # for pyiceberg capture_snapshot read-back
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark-apps:/opt/spark-apps # spark-submit client reads the app file
    depends_on:
      airflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
    networks: [lineage-poc]

  airflow-scheduler:
    image: data-lineage-poc/airflow:3.2.2
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    command: airflow scheduler
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark-apps:/opt/spark-apps
    depends_on:
      airflow-db:
        condition: service_healthy
    networks: [lineage-poc]

  airflow-dag-processor:
    image: data-lineage-poc/airflow:3.2.2
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-dag-processor
    command: airflow dag-processor
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark-apps:/opt/spark-apps
    depends_on:
      airflow-db:
        condition: service_healthy
    networks: [lineage-poc]

  spark-master:
    image: data-lineage-poc/spark:3.5.0
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    ports:
      - "8082:8080" # Spark master UI (host remap avoids 8080 collision with Airflow)
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pocadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./spark-apps:/opt/spark-apps # driver/executors read the app file
    depends_on:
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
      marquez:
        condition: service_healthy # Spark OL listener posts to Marquez at app run time (T-01)
      mc:
        condition: service_completed_successfully # bucket poc-warehouse must exist before Spark DDL (D6)
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/')\""]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lineage-poc]

  spark-worker:
    image: data-lineage-poc/spark:3.5.0
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker
    ports:
      - "8084:8081" # Spark worker UI (host remap; 8083 is taken by Connect)
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pocadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./spark-apps:/opt/spark-apps
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/')\""]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lineage-poc]

  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.4 # NOT Docker Hub; UI port 9000 would collide with MinIO
    container_name: nessie
    ports:
      - "19120:19120"
    environment:
      NESSIE_VERSION_STORE_TYPE: ROCKSDB # persists catalog metadata to the named volume (spec 05)
      # Correct 0.108.4 key is .persist.rocks.database-path (NOT .persist.rocksdb.db-path,
      # which is silently ignored -> RocksDB fell back to /tmp/nessie-rocksdb-store in the
      # container layer and tables were lost on recreate). Points RocksDB at the volume.
      # The volume is mounted at /deployments/data (owned by the nessie user, uid 10000)
      # because a fresh named volume mounted at /data is root-owned and RocksDB cannot
      # mkdir there (Permission denied). Mounting at an image dir owned by nessie makes
      # Docker copy that ownership into the empty volume.
      NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /deployments/data/nessie
      # Iceberg REST catalog (spec 05 §2): the pyiceberg capture_snapshot read-back
      # (dags/load_*.py) uses type="rest" against /iceberg/ (pyiceberg 0.11.1 has no
      # native Nessie type). Nessie must know the warehouse name -> location mapping;
      # "warehouse" is the default so clients can omit the warehouse param.
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://poc-warehouse/
      # Server-side S3/MinIO credentials (EXE-02 blocker, RESOLVED): with the Iceberg
      # REST catalog, NESSIE (not the client) reads the table metadata from the object
      # store, so the S3 access key/secret must be configured server-side here. The
      # client-side s3.* props in dags/config.py are NOT forwarded for the metadata
      # read (the REST server does it). STATIC auth via a Quarkus basic-credentials
      # secret (urn:nessie-secret:quarkus:...). Nessie >= 0.92 uses the
      # default-options. segment. Values must match .env.example MinIO creds.
      nessie.catalog.service.s3.default-options.auth-type: STATIC
      nessie.catalog.service.s3.default-options.access-key: "urn:nessie-secret:quarkus:nessie-s3"
      nessie-s3.name: ${MINIO_ROOT_USER:-pocadmin}
      nessie-s3.secret: ${MINIO_ROOT_PASSWORD}
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.region: us-east-1
    volumes:
      - nessie-data:/deployments/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/19120'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lineage-poc]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "9000:9000" # S3 API
      - "9002:9001" # console (host remap)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pocadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: us-east-1 # S3 clients (S3FileIO) expect a region (spec 05)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lineage-poc]

  # ---------------------------------------------------------------------------
  # OpenLineage backend: Marquez (API + UI) on postgres:14
  # ---------------------------------------------------------------------------
  marquez-db:
    image: postgres:14
    container_name: marquez-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
      - ./provisioning/init-marquez.sql:/docker-entrypoint-initdb.d/01-marquez.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [lineage-poc]

  marquez:
    image: marquezproject/marquez:0.50.0
    container_name: marquez
    ports:
      - "5000:5000" # OpenLineage API (Debezium http transport posts here)
      - "5001:5001" # admin interface (/healthcheck)
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    depends_on:
      marquez-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5001'"]
      interval: 15s
      timeout: 10s
      retries: 30
    networks: [lineage-poc]

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    container_name: marquez-web
    ports:
      - "3000:3000" # Marquez UI (lineage graph)
    environment:
      WEB_PORT: 3000
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
    depends_on:
      marquez:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/healthcheck >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
    networks: [lineage-poc]

  # ---------------------------------------------------------------------------
  # One-shot provisioning gates
  # ---------------------------------------------------------------------------
  mc:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z # pinned (D4); matches the minio/minio pin era
    container_name: mc
    entrypoint: ["/bin/sh", "/provisioning/mc-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pocadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./provisioning/mc-init.sh:/provisioning/mc-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [lineage-poc]

  provision:
    image: curlimages/curl:8.10.1
    container_name: provision
    entrypoint: ["/bin/sh", "/provisioning/register-connectors.sh"]
    volumes:
      - ./provisioning/register-connectors.sh:/provisioning/register-connectors.sh:ro
    depends_on:
      connect:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: "no"
    networks: [lineage-poc]